{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
    <h2>Finalizar jornada</h2>
    <p>Si ya has terminado tu trabajo de hoy, registra ahora el fin de jornada.</p>
    <p><strong>Fecha:</strong> {{ hoy }}</p>

    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        <button type="submit" class="btn">Registrar fin de jornada</button>
    </form>
</div>
{% endblock %}
